name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run backend unit tests
        run: cd backend && ./mvnw test -Dtest='!*IT'

  deploy:
    needs: [test-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/salesapp-backend:latest"
          docker build -t "$IMAGE_URI" backend/
          docker push "$IMAGE_URI"

      - name: Build and push frontend image
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/salesapp-frontend:latest"
          docker build --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" -t "$IMAGE_URI" frontend/
          docker push "$IMAGE_URI"

      - name: Trigger App Runner deployments
        run: |
          BACKEND_ARN=$(aws apprunner list-services --region us-east-1 --query "ServiceSummaryList[?ServiceName=='salesapp-backend'].ServiceArn" --output text)
          FRONTEND_ARN=$(aws apprunner list-services --region us-east-1 --query "ServiceSummaryList[?ServiceName=='salesapp-frontend'].ServiceArn" --output text)
          aws apprunner start-deployment --service-arn "$BACKEND_ARN" --region us-east-1 > /dev/null
          aws apprunner start-deployment --service-arn "$FRONTEND_ARN" --region us-east-1 > /dev/null
