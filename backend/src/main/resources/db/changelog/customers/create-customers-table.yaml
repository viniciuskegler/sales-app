databaseChangeLog:
  - changeSet:
      id: 003-create-customers-table
      author: migration
      changes:
        - createTable:
            tableName: customers
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  generationType: always
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: first_name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: last_name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: phone_number
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: true
                    foreignKeyName: fk_customers_user_id
                    references: users(id)

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false