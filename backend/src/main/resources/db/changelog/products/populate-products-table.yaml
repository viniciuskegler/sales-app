databaseChangeLog:
- changeSet:
    id: 006-load-products
    author: migration
    changes:
      - loadData:
          file: db/changelog/products/csvs/product.csv
          tableName: product
          separator: ","
          encoding: UTF-8

- changeSet:
    id: 007-load-tags
    author: migration
    changes:
      - loadData:
          file: db/changelog/products/csvs/tag.csv
          tableName: tag
          separator: ","
          encoding: UTF-8

- changeSet:
