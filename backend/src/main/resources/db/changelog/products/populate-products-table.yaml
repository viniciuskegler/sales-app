    author: migration
    changes:
      - loadData:
          file: db/changelog/products/csvs/product_tag.csv
          tableName: product_tag
          separator: ","
          encoding: UTF-8

- changeSet:
    id: 009-load-product-images
    author: migration
    changes:
      - loadData:
          file: db/changelog/products/csvs/product_image.csv
          tableName: product_image
          separator: ","
          encoding: UTF-8

- changeSet:
    id: 010-load-reviews
    author: migration
    changes:
      - loadData:
          file: db/changelog/products/csvs/review.csv
