databaseChangeLog:
  - changeSet:
      id: 001-create-products-table
      author: migration
      changes:
        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  generationType: always
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: title
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: category
                  type: VARCHAR(25)
                  constraints:
                    nullable: false

              - column:
                  name: price
                  type: NUMERIC(10,2)
                  constraints:
                    nullable: false

              - column:
                  name: discount_percentage
                  type: NUMERIC(5,2)

              - column:
                  name: rating
                  type: NUMERIC(3,2)

              - column:
                  name: stock
                  type: INT

              - column:
                  name: brand
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: sku
                  type: VARCHAR(15)
                  constraints:
                    unique: true
                    nullable: false

              - column:
                  name: thumbnail
                  type: TEXT
                  constraints:
                    nullable: false

  - changeSet:
      id: 002-create-reviews-table
      author: migration
      changes:
        - createTable:
            tableName: reviews
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  generationType: always
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: rating
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: comment
                  type: VARCHAR(255)

              - column:
                  name: review_date
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: reviewer_name
                  type: VARCHAR(80)
                  constraints:
                    nullable: false

              - column:
                  name: reviewer_email
                  type: VARCHAR(80)
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: reviews
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id
            constraintName: fk_reviews_products
            onDelete: CASCADE

  - changeSet:
      id: 003-create-tag-table
      author: migration
      changes:
        - createTable:
            tableName: tags
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  generationType: always
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(25)
                  constraints:
                    nullable: false
                    unique: true

  - changeSet:
      id: 004-create-product-tag-table
      author: migrations
      changes:
        - createTable:
            tableName: products_tags
            columns:
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: tag_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: products_tags
            columnNames: product_id, tag_id
            constraintName: pk_products_tags

        - addForeignKeyConstraint:
            baseTableName: products_tags
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id
            constraintName: fk_products_tags_products
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: products_tags
            baseColumnNames: tag_id
            referencedTableName: tags
            referencedColumnNames: id
            constraintName: fk_products_tags_tags
            onDelete: CASCADE

  - changeSet:
      id: 005-create-products-images-table
      author: migration
      changes:
        - createTable:
            tableName: products_images
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  generationType: always
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: url
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: position
                  type: INT

        - addForeignKeyConstraint:
            baseTableName: products_images
            baseColumnNames: product_id
            referencedTableName: products
            referencedColumnNames: id
            constraintName: fk_products_images_products
            onDelete: CASCADE