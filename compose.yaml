services:
  postgres:
    image: 'postgres:16'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=${POSTGRES_USER}'
    ports:
      - '${POSTGRES_PORT}'
  rabbitmq:
    image: 'rabbitmq:latest'
    environment:
      - '${RABBITMQ_DEFAULT_PASS}=secret'
      - '${RABBITMQ_DEFAULT_USER}=myuser'
    ports:
      - '${RABBITMQ_PORT}'
